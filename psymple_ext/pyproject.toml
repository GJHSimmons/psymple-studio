[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "psymple_ext"
version = "0.1.0"
description = "psymple-adjacent ingestion and inspection, destined for upstream psymple."
requires-python = ">=3.10"
dependencies = ["psymple>=1.0.4"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["psymple_ext*"]
