    ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--color-neutral-300);border-radius:8px;border:2px solid var(--color-bg)}

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}">
class Component extends DCLogic {
  state = {
    screen: "dashboard",
    pos: {},                    // node position overrides (relative to parent): id -> {x,y}
    exp: {},                    // composite expand overrides: id -> bool (else depth-based)
    sel: null,                  // selected node id
    zoom: 1,
    pan: {x:0,y:0},
    overlay: null,              // null | "library" | "editor" — pop-ups over the builder
    wires: {},                  // per-view live wire overrides (mutable copy of model wires)
    selWire: null,              // {owner,kind,i} of a selected wire (for deletion)
    wireFrom: null,             // {node,port} while dragging a new wire
    mouse: null,                // {x,y} world coords of cursor during a wire drag
    editObj: "pred_prey",
    depth: 2,                   // how many nesting levels to expand by default
    params: {a:0.4, K:10, b:0.2, c:0.1, d:0.2, x0:10, y0:2, tend:100},
    solver: "continuous",
    ran: true,
    tab: "time",                // simulate output tab
    ctab: "system",             // compilation tab
    addedPorts: {},                // composite id -> {in:[[name,def]], out:[[name]], var:[name]}
    newPort: null,                 // {compId, side} while naming a new port
    newPortName: "",
    newPortDef: "",
    railCollapsed: false,
  };

  // ---- nested model tree -------------------------------------------------
  // A composite is drawn as its own ported object that CONTAINS its children.
  // Every node (leaf or container) carries ports: inputs top, outputs bottom,
  // variables right. Wires live inside the composite that owns them; an
  // endpoint node of "__self" refers to that composite's own port.
  tree(){
    const t = {
      id:"ecosystem", name:"ecosystem", type:"composite",
      ports:{in:[["a",0.4],["b",0.2],["c",0.1],["d",0.2],["K",10]], out:[], var:["x","y"]},
      children:[
        {id:"prey", name:"prey", type:"composite", x:26, y:22, note:"logistic prey",
          ports:{in:[["r",0.4],["K",10]], out:[], var:["x"]},
          children:[
            {id:"pop", name:"pop", type:"variable", x:24, y:22, w:154, h:64,
              ports:{in:[["r",null]], out:[], var:["x"]}, asg:[["x","r*x"]]},
            {id:"limit", name:"limit", type:"variable", x:24, y:158, w:154, h:64,
              ports:{in:[["r",null],["K",null]], out:[], var:["x"]}, asg:[["x","-r/K * x**2"]]},
          ],
          dwires:[
            {from:{node:"__self",port:"r"}, to:{node:"pop",port:"r"}},
            {from:{node:"__self",port:"r"}, to:{node:"limit",port:"r"}},
            {from:{node:"__self",port:"K"}, to:{node:"limit",port:"K"}},
          ],
          vwires:[
            {from:{node:"pop",port:"x"}, to:{node:"__self",port:"x"}},
            {from:{node:"limit",port:"x"}, to:{node:"__self",port:"x"}},
          ],
        },
        {id:"pred", name:"pred", type:"variable", x:26, y:320, w:154, h:64,
          ports:{in:[["r",0.2]], out:[], var:["x"]}, asg:[["x","-r*x"]]},
        {id:"pred_prey", name:"pred_prey", type:"variable", x:380, y:150, w:176, h:88,
          ports:{in:[["r_1",0.2],["r_2",0.1]], out:[], var:["x","y"]}, asg:[["x","-r_1*x*y"],["y","r_2*x*y"]]},
      ],
      dwires:[
        {from:{node:"__self",port:"a"}, to:{node:"prey",port:"r"}},
        {from:{node:"__self",port:"K"}, to:{node:"prey",port:"K"}},
        {from:{node:"__self",port:"b"}, to:{node:"pred_prey",port:"r_1"}},
        {from:{node:"__self",port:"c"}, to:{node:"pred_prey",port:"r_2"}},
        {from:{node:"__self",port:"d"}, to:{node:"pred",port:"r"}},
      ],
      vwires:[
        {from:{node:"prey",port:"x"}, to:{node:"__self",port:"x"}},
        {from:{node:"pred_prey",port:"x"}, to:{node:"__self",port:"x"}},
        {from:{node:"pred",port:"x"}, to:{node:"__self",port:"y"}},
        {from:{node:"pred_prey",port:"y"}, to:{node:"__self",port:"y"}},
      ],
    };
    const add=this.state.addedPorts||{};
    const walk=(n)=>{
      if(n.type==="composite"&&add[n.id]){ const a=add[n.id];
        n.ports={in:[...n.ports.in,...(a.in||[])],out:[...n.ports.out,...(a.out||[])],var:[...n.ports.var,...(a.var||[])]}; }
      (n.children||[]).forEach(walk);
    };
    walk(t);
    return t;
  }
  // flat lookups over the tree
  compById(id){ const walk=(n)=> n.id===id ? n : (n.children||[]).reduce((f,c)=>f||walk(c),null); return walk(this.tree()); }
  parentOf(id){ const walk=(n)=>{ if((n.children||[]).some(c=>c.id===id)) return n; return (n.children||[]).reduce((f,c)=>f||walk(c),null); }; return walk(this.tree()); }
  composites(){ const out=[]; const walk=(n)=>{ if(n.type==="composite"){out.push(n);(n.children||[]).forEach(walk);} }; walk(this.tree()); return out; }
  rpos(node){ const o=this.state.pos[node.id]; return o?{x:o.x,y:o.y}:{x:node.x||0,y:node.y||0}; }
  isExp(node,level){ if(node.type!=="composite") return false; const e=this.state.exp[node.id]; return e!==undefined ? e : (level < this.state.depth); }
  // recursive absolute layout -> boxes map {id:{x,y,w,h,node,level,exp}}
  buildBoxes(){ const boxes={}; const HEAD=30;
    const place=(node,x,y,level)=>{
      const exp=this.isExp(node,level); let w,h;
      if(node.type==="composite" && exp){
        const cox=x+30, coy=y+HEAD+24; let mr=0,mb=0; const laid=[];
        (node.children||[]).forEach(c=>{
          const r=this.rpos(c);
          let cy=r.y;
          if(!this.state.pos[c.id]){ // un-dragged: keep it clear of siblings already placed
            const probe=place(c,cox+r.x,coy+cy,level+1);
            for(let guard=0;guard<8;guard++){
              const hit=laid.find(p=>r.x<p.x+p.w && r.x+probe.w>p.x && cy<p.y+p.h && cy+probe.h>p.y);
              if(!hit) break;
              cy=hit.y+hit.h+24;
            }
          }
          const s=place(c,cox+r.x,coy+cy,level+1);
          laid.push({x:r.x,y:cy,w:s.w,h:s.h});
          mr=Math.max(mr,r.x+s.w); mb=Math.max(mb,cy+s.h);
        });
        w=Math.max(220,60+mr); h=HEAD+24+mb+30;
      } else if(node.type==="composite"){
        const eq=this.compiledEqns(node)||[];
        w=Math.max(node.w||180,190); h=HEAD+14+eq.length*22+30;
      } else { w=node.w||156; h=Math.max((node.h||64)+14, 34+((node.asg?node.asg.length:1)*30)+14); }
      boxes[node.id]={x,y,w,h,node,level,exp};
      return {w,h};
    };
    place(this.tree(),0,0,0);
    return boxes;
  }

  library(){
    return [
      {id:"prey", name:"prey", type:"composite", desc:"Logistic single-species growth", tags:["1 var","2 params"], asg:["dx/dt = r·x(1 − x/K)"]},
      {id:"pred", name:"pred", type:"variable", desc:"Exponential decay population", tags:["1 var","1 param"], asg:["dx/dt = −r·x"]},
      {id:"pred_prey", name:"pred_prey", type:"variable", desc:"Two-species interaction term", tags:["2 vars","2 params"], asg:["dx/dt = −r₁·x·y","dy/dt = r₂·x·y"]},
      {id:"pop", name:"pop", type:"variable", desc:"Generic per-capita growth", tags:["1 var","1 param"], asg:["dx/dt = r·x"]},
      {id:"limit", name:"limit", type:"variable", desc:"Carrying-capacity brake", tags:["1 var","2 params"], asg:["dx/dt = −r/K·x²"]},
      {id:"f_drag", name:"f_drag", type:"functional", desc:"Drag multiplier μ", tags:["1 fn","4 inputs"], asg:["μ = C·ρ·A / (2·m)"]},
      {id:"f_gravity", name:"f_gravity", type:"functional", desc:"Newtonian gravitation", tags:["1 fn","4 inputs"], asg:["F = G·m₁·m₂ / r²"]},
    ];
  }

  // ---- integrator (logistic Lotka–Volterra) ------------------------------
  integrate(){
    const p=this.state.params, dt=0.05, n=Math.round(p.tend/dt);
    let x=p.x0, y=p.y0; const T=[],X=[],Y=[];
    for(let i=0;i<=n;i++){
      const t=i*dt;
      if(i%2===0){T.push(t);X.push(x);Y.push(y);}
      const dx=p.a*x*(1-x/p.K)-p.b*x*y;
      const dy=p.c*x*y-p.d*y;
      x+=dx*dt; y+=dy*dt;
      if(x<0)x=0; if(y<0)y=0;
    }
    return {T,X,Y};
  }

  // ---- LaTeX math rendering -----------------------------------------------
  toLatex(expr){
    let s=String(expr).replace(/\s+/g,"");
    const SUP={"²":"2","³":"3"}; s=s.replace(/[²³]/g,c=>"^{"+SUP[c]+"}");
    const SUB="₀₁₂₃₄₅₆₇₈₉"; s=s.replace(/[₀₁₂₃₄₅₆₇₈₉]+/g,m=>"_{"+[...m].map(c=>SUB.indexOf(c)).join("")+"}");
    s=s.replace(/\*\*/g,"^");
    s=s.replace(/([A-Za-z0-9_)\]}]+)\^([0-9]+)/g,(m,b,e)=>b+"^{"+e+"}");
    s=s.replace(/\(agg\)/g,"(b{\\cdot}x{\\cdot}y)");
    s=s.replace(/([\w{}^]+)\/\(([^()]*)\)/g,"\\frac{$1}{$2}");
    s=s.replace(/([\w{}^]+)\/([\w{}^]+)/g,"\\frac{$1}{$2}");
    s=s.replace(/\*/g," \\cdot ").replace(/·/g," \\cdot ");
    s=s.replace(/−/g," - ").replace(/-/g," - ");
    s=s.replace(/μ/g,"\\mu ").replace(/ρ/g,"\\rho ");
    return s;
  }
  texHtml(latex){
    try{ return window.katex ? window.katex.renderToString(latex,{throwOnError:false,output:"html"}) : latex; }
    catch(e){ return latex; }
  }
  lhsHtml(name,isOde){ return this.texHtml(isOde?"\\frac{d"+name+"}{dt}":this.toLatex(name)); }
  eqHtml(lhs,rhs,isOde){ return this.texHtml((isOde?"\\frac{d"+lhs+"}{dt}":this.toLatex(lhs))+"="+this.toLatex(rhs)); }
  // live compiled equations for a composite (shown when collapsed)
  compiledEqns(n){
    return {
      prey:[["x","r*x*(1 - x/K)"]],
      ecosystem:[["x","a*x*(1 - x/K) - b*x*y"],["y","c*x*y - d*y"]],
    }[n.id]||null;
  }

  npos(){ return {x:0,y:0}; }

  // ---- user-defined composite ports --------------------------------------
  addedNames(id,side){ const a=this.state.addedPorts[id]; if(!a) return []; return (a[side]||[]).map(p=>side==="var"?p:p[0]); }
  beginAddPort(compId,side){ this.setState({newPort:{compId,side}, newPortName:"", newPortDef:""}); }
  cancelAddPort(){ this.setState({newPort:null}); }
  commitAddPort(){
    const np=this.state.newPort; if(!np) return;
    const name=(this.state.newPortName||"").trim(); if(!name) return;
    const c=this.compById(np.compId); if(!c) return;
    const exists=[...c.ports.in.map(p=>p[0]),...c.ports.out.map(p=>p[0]),...c.ports.var].includes(name);
    if(exists){ this.setState({newPort:null}); return; }
    let entry;
    if(np.side==="in"){ const dv=this.state.newPortDef; entry=[name, dv===""||dv==null?null:(isNaN(+dv)?dv:+dv)]; }
    else if(np.side==="out"){ entry=[name]; }
    else { entry=name; }
    this.setState(st=>{
      const cur=st.addedPorts[np.compId]||{in:[],out:[],var:[]};
      const next={in:cur.in.slice(),out:cur.out.slice(),var:cur.var.slice()};
      next[np.side]=[...next[np.side],entry];
      return {addedPorts:{...st.addedPorts,[np.compId]:next}, newPort:null, newPortName:"", newPortDef:""};
    });
  }
  removeAddedPort(compId,side,name){
    this.setState(st=>{
      const cur=st.addedPorts[compId]; if(!cur) return {};
      const filt=(cur[side]||[]).filter(p=>(side==="var"?p:p[0])!==name);
      return {addedPorts:{...st.addedPorts,[compId]:{...cur,[side]:filt}}};
    });
  }
  edgeAdders(h,n){
    const hv=this.state.hoverAdd; if(!hv||hv.id!==n.id) return null;
    const label={in:"Add input port (left edge)",out:"Add output port (right edge)",var:"Add variable port (bottom edge)"}[hv.side];
    const st=hv.side==="in"?{left:"0%",top:(hv.pos*100)+"%"}:hv.side==="out"?{left:"100%",top:(hv.pos*100)+"%"}:{left:(hv.pos*100)+"%",top:"100%"};
    return h("button",{key:"add"+hv.side,className:"psy-ghost",title:label,
      onMouseDown:(e)=>e.stopPropagation(),
      onClick:(e)=>{e.stopPropagation();this.beginAddPort(n.id,hv.side);},
      style:{position:"absolute",transform:"translate(-50%,-50%)",width:"16px",height:"16px",borderRadius:"50%",

  }
  edgeHover(e,n,bx){
    const r=e.currentTarget.getBoundingClientRect();
    const x=e.clientX-r.left, y=e.clientY-r.top, w=r.width, ht=r.height, PAD=16, TOP=34;
    const dLeft=x, dRight=w-x, dBottom=ht-y;
    const min=Math.min(dLeft,dRight,dBottom);
    let side,pos;
    if(min===dBottom){ side="var"; pos=w<=PAD*2?0.5:Math.min(1-PAD/w,Math.max(PAD/w,x/w)); }
    else { side=min===dLeft?"in":"out"; pos=ht<=PAD*2?0.5:Math.min(1-PAD/ht,Math.max(PAD/ht,y/ht)); }
    this.setState({hoverAdd:{id:n.id,side,pos}});
  }

  // ---- interaction -------------------------------------------------------
  fitSoon(){ setTimeout(()=>this.fitView(),70); }
  go(s){ this.setState({screen:s, overlay:null, wireFrom:null, selWire:null}, ()=>{ if(s==="builder") this.fitSoon(); }); }
  select(id){ this.setState({sel:id, selWire:null}); }
  toggleExp(id,cur){ this.setState(st=>({exp:{...st.exp,[id]:!cur}, selWire:null}), ()=>this.fitSoon()); }
  setDepth(d){ this.setState({depth:d, exp:{}}, ()=>this.fitSoon()); }
  openLibrary(){ this.setState({overlay:"library"}); }
  openEditor(id){ this.setState({overlay:"editor", editObj:id||this.state.editObj}); }
  closeOverlay(){ this.setState({overlay:null}); }

  // ---- live wire store (mutable copy of a composite's wires) -------------
  getWires(owner){
    const w=this.state.wires[owner];
    if(w) return w;
    const c=this.compById(owner);
    return {d:(c.dwires||[]).map(x=>({...x})), v:(c.vwires||[]).map(x=>({...x}))};
  }
  setWires(owner,next){ this.setState(st=>({wires:{...st.wires,[owner]:next}})); }
  deleteWire(owner,kind,i){
    const w=this.getWires(owner);
    const next={d:w.d.slice(), v:w.v.slice()};
    next[kind].splice(i,1);
    this.setWires(owner,next);
    this.setState({selWire:null});
  }

  startDrag(e,id){
    e.stopPropagation(); e.preventDefault();
    const start={mx:e.clientX,my:e.clientY};
    const node=this.compById(id); const base=this.rpos(node);
    const z=this.state.zoom;
    const move=(ev)=>{
      const nx=base.x+(ev.clientX-start.mx)/z, ny=base.y+(ev.clientY-start.my)/z;
      this.setState(st=>({pos:{...st.pos,[id]:{x:Math.max(0,nx),y:Math.max(0,ny)}}}));
    };
    const up=()=>{document.removeEventListener("mousemove",move);document.removeEventListener("mouseup",up);};
    document.addEventListener("mousemove",move);document.addEventListener("mouseup",up);
    this.setState({sel:id, selWire:null});
  }
  startPan(e){
    if(e.target!==e.currentTarget) return;
    this.setState({sel:null, selWire:null});
    const start={mx:e.clientX,my:e.clientY}, base={...this.state.pan};
    const move=(ev)=>this.setState({pan:{x:base.x+(ev.clientX-start.mx),y:base.y+(ev.clientY-start.my)}});
    const up=()=>{document.removeEventListener("mousemove",move);document.removeEventListener("mouseup",up);};
    document.addEventListener("mousemove",move);document.addEventListener("mouseup",up);
  }
  worldXY(ev){
    const el=this.canvasEl; if(!el) return {x:0,y:0};
    const r=el.getBoundingClientRect(), S=this.state;
    return {x:(ev.clientX-r.left-S.pan.x)/S.zoom, y:(ev.clientY-r.top-S.pan.y)/S.zoom};
  }
  levelOf(id){ let n=0,p=this.parentOf(id); while(p){n++;p=this.parentOf(p.id);} return n; }
  ownerFor(na,nb){
    let best=null,bl=-1;
    this.composites().forEach(c=>{
      const scope=new Set([c.id,...(c.children||[]).map(k=>k.id)]);
      if(scope.has(na)&&scope.has(nb)){ const l=this.levelOf(c.id); if(l>bl){bl=l;best=c;} }
    });
    return best;
  }
  startWire(e,ep){
    e.stopPropagation(); e.preventDefault();
    this.setState({wireFrom:ep, mouse:this.worldXY(e), sel:null, selWire:null});
    const move=(ev)=>this.setState({mouse:this.worldXY(ev)});
    const up=()=>{
      document.removeEventListener("mousemove",move);
      document.removeEventListener("mouseup",up);
      setTimeout(()=>{ if(this.state.wireFrom) this.setState({wireFrom:null,mouse:null}); },0);
    };
    document.addEventListener("mousemove",move);
    document.addEventListener("mouseup",up);
  }
  dropWire(e,ep){
    e.stopPropagation();
    const from=this.state.wireFrom;
    if(!from){ return; }
    this.setState({wireFrom:null, mouse:null});
    if(from.node===ep.node) return;
    const owner=this.ownerFor(from.node,ep.node);
    if(!owner) return;
    // role within the owning composite: owner's own input emits; its var/out receive
    const role=(x)=>{ const o=x.node===owner.id; return x.side==="in" ? (o?"src":"dst") : (o?"dst":"src"); };
    const ra=role(from), rb=role(ep);
    if(ra===rb) return;
    const srcE=ra==="src"?from:ep, dstE=ra==="src"?ep:from;
    const mk=(x)=>({node:x.node===owner.id?"__self":x.node, port:x.port});
    const kind=(from.side==="var"&&ep.side==="var")?"v":"d";
    const w=this.getWires(owner.id); const next={d:w.d.slice(),v:w.v.slice()};
    next[kind].push({from:mk(srcE),to:mk(dstE)});
    this.setWires(owner.id,next);
  }
  zoomBy(d){ this.setState(st=>({zoom:Math.max(0.4,Math.min(1.6,+(st.zoom+d).toFixed(2)))})); }
  fitView(){
    const el=this.canvasEl; if(!el) return;
    const r=this.buildBoxes()[this.tree().id];
    const gw=r.w, gh=r.h, cw=el.clientWidth, ch=el.clientHeight;
    if(!cw||!ch) return;
    const padL=24, padR=24, padT=28, padB=150;
    const uw=cw-padL-padR, uh=ch-padT-padB;
    const z=Math.max(0.35,Math.min(1.05, Math.min(uw/gw, uh/gh)));
    const pan={x:padL+(uw-gw*z)/2 - r.x*z, y:padT+(uh-gh*z)/2 - r.y*z};
    this.setState({zoom:+z.toFixed(3), pan});
  }

  setP(k,v){ this.setState(st=>({params:{...st.params,[k]:v}, ran:false})); }
  run(){ this.setState({ran:true}); }

  // ---- port geometry (absolute, from the boxes map) ----------------------
  portPoint(ownerId,ep,boxes){
    const id = ep.node==="__self" ? ownerId : ep.node;
    const box=boxes[id]; if(!box) return null;
    const n=box.node, owner=(ep.node==="__self");
    const pin=n.ports.in.findIndex(a=>a[0]===ep.port);
    if(pin>=0) return {x:box.x, y:box.y+30+(pin+1)/(n.ports.in.length+1)*(box.h-30), side:owner?"inOwner":"in"};
    const pv=n.ports.var.indexOf(ep.port);
    if(pv>=0) return {x:box.x+(pv+1)/(n.ports.var.length+1)*box.w, y:box.y+box.h, side:owner?"varOwner":"var"};
    const po=n.ports.out.findIndex(a=>a[0]===ep.port);
    if(po>=0) return {x:box.x+box.w, y:box.y+30+(po+1)/(n.ports.out.length+1)*(box.h-30), side:owner?"outOwner":"out"};
    return {x:box.x+box.w/2, y:box.y+box.h/2, side:"in"};
  }
  portPtChild(ep,boxes){
    const box=boxes[ep.node]; if(!box) return null;
    const n=box.node;
    const pin=n.ports.in.findIndex(a=>a[0]===ep.port);
    if(pin>=0) return {x:box.x, y:box.y+30+(pin+1)/(n.ports.in.length+1)*(box.h-30), side:"in"};
    const pv=n.ports.var.indexOf(ep.port);
    if(pv>=0) return {x:box.x+(pv+1)/(n.ports.var.length+1)*box.w, y:box.y+box.h, side:"var"};
    const po=n.ports.out.findIndex(a=>a[0]===ep.port);
    if(po>=0) return {x:box.x+box.w, y:box.y+30+(po+1)/(n.ports.out.length+1)*(box.h-30), side:"out"};
    return null;
  }
  wirePath(a,b){
    const c={in:[-46,0],out:[46,0],var:[0,46],inOwner:[46,0],varOwner:[0,-46],outOwner:[-46,0]};
    const [ax,ay]=c[a.side]||[0,0], [bx,by]=c[b.side]||[0,0];
    return `M ${a.x} ${a.y} C ${a.x+ax} ${a.y+ay}, ${b.x+bx} ${b.y+by}, ${b.x} ${b.y}`;
  }

  // ---- BUILDER (nested canvas) -------------------------------------------
  scrBuilder(h){
    const S=this.state;
    const root=this.tree();
    const boxes=this.buildBoxes();
    const layers={}; const handles=[]; const rubber=[];
    const bucket=(owner)=>(layers[owner]||(layers[owner]=[]));
    const drawW=(w,i,kind,owner)=>{
      const a=this.portPoint(owner,w.from,boxes), b=this.portPoint(owner,w.to,boxes);
      if(!a||!b) return;
      const on=S.selWire&&S.selWire.owner===owner&&S.selWire.kind===kind&&S.selWire.i===i;
      const col=kind==="v"?"var(--color-accent-800)":"var(--color-accent)";
      bucket(owner).push(h("path",{key:owner+kind+i,d:this.wirePath(a,b),fill:"none",stroke:col,
        strokeWidth:on?3.2:(kind==="v"?2.4:1.6),strokeDasharray:kind==="v"?"1 5":"none",strokeLinecap:"round",
        markerEnd:kind==="d"?(on?"url(#wire-arrow-sel)":"url(#wire-arrow)"):undefined}));
      const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
      handles.push(h("div",{key:"hdl"+owner+kind+i,
        onMouseDown:(e)=>e.stopPropagation(),
        onClick:(e)=>{e.stopPropagation(); on?this.deleteWire(owner,kind,i):this.setState({selWire:{owner,kind,i},sel:null});},
        title:on?"Delete wire":"Select wire",
        style:{position:"absolute",left:mx+"px",top:my+"px",width:on?"20px":"12px",height:on?"20px":"12px",
          transform:"translate(-50%,-50%)",borderRadius:"50%",cursor:"pointer",zIndex:((boxes[owner]?boxes[owner].level:0)+1)*10+6,
          display:"grid",placeItems:"center",

  // ---- SIMULATE ----------------------------------------------------------
  scrSimulate(h){
    const S=this.state, P=S.params;
    const data=S.ran?this.integrate():null;
    const sliders=[
      ["a","prey growth rate",0,1,0.01],["K","prey carrying capacity",1,20,0.5],
      ["b","predation rate",0,0.6,0.01],["c","predator response",0,0.4,0.01],
      ["d","predator death rate",0,0.6,0.01],
    ];
    return h("div",{style:{display:"flex",flexDirection:"column",height:"100%"}},
      this.header(h,"Simulation","ecosystem",[
        h("div",{key:"solv",className:"seg"},
          ["continuous","discrete"].map(s=>h("label",{key:s,className:"seg-opt"},
            h("input",{type:"radio",name:"solver",checked:S.solver===s,onChange:()=>this.setState({solver:s})}),s)),
        ),
        h("button",{className:"btn btn-primary",key:"r",onClick:()=>this.run()},this.icon(h,"play",15),"Run simulation"),
      ]),
      h("div",{style:{flex:1,display:"flex",minHeight:0}},
        // params panel
        h("div",{className:"psy-scroll",style:{width:"300px",flex:"none",borderRight:"1px solid var(--color-divider)",padding:"20px",background:"var(--color-bg)"}},
          h("h6",{style:{margin:"0 0 14px"}},"Initial values"),
          h("div",{style:{display:"flex",gap:"12px",marginBottom:"22px"}},
            ["x0","y0"].map((k,i)=>h("div",{key:k,className:"field",style:{flex:1}},
              h("label",{className:"psy-mono"},["x","y"][i]," (0)"),
              h("input",{className:"input psy-mono",type:"number",value:P[k],onChange:(e)=>this.setP(k,+e.target.value)}))),
          ),
          h("h6",{style:{margin:"0 0 14px"}},"Parameters"),
          sliders.map(([k,label,min,max,step])=>h("div",{key:k,style:{marginBottom:"16px"}},
            h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:"12px",marginBottom:"4px"}},
              h("span",null,h("span",{className:"psy-mono",style:{color:"var(--color-accent)",fontWeight:700}},k),h("span",{className:"text-muted"}," · "+label)),
              h("span",{className:"psy-mono",style:{fontWeight:700}},P[k]),
            ),
            h("input",{type:"range",min,max,step,value:P[k],style:{width:"100%",background:"linear-gradient(to right,var(--color-accent) 0 "+((P[k]-min)/(max-min)*100)+"%,var(--color-neutral-200) "+((P[k]-min)/(max-min)*100)+"% 100%)"},onChange:(e)=>this.setP(k,+e.target.value)}),
          )),
          h("div",{className:"field",style:{marginTop:"8px"}},
            h("label",null,"t_end"),
            h("input",{className:"input psy-mono",type:"number",value:P.tend,onChange:(e)=>this.setP("tend",+e.target.value)})),
          !S.ran&&h("div",{style:{marginTop:"14px",padding:"10px",border:"1px solid var(--color-accent)",fontSize:"12px",color:"var(--color-accent-800)",display:"flex",alignItems:"center",gap:"8px"}},
            this.icon(h,"dot",15),"Parameters changed — re-run to update."),
        ),
        // results
        h("div",{style:{flex:1,display:"flex",flexDirection:"column",minWidth:0}},
          h("div",{style:{display:"flex",gap:"24px",padding:"12px 20px 0",borderBottom:"1px solid var(--color-divider)"}},
            [["time","Time series"],["phase","Phase plane"],["table","Data table"]].map(([k,l])=>
              h("div",{key:k,onClick:()=>this.setState({tab:k}),style:{padding:"0 0 12px",marginBottom:"-1px",cursor:"pointer",fontFamily:"var(--font-heading)",fontWeight:S.tab===k?600:500,fontSize:"14px",
                borderBottom:"2px solid "+(S.tab===k?"var(--color-accent)":"transparent"),
                color:S.tab===k?"var(--color-text)":"var(--color-neutral-600)",transition:"color .15s"}},l)),

  plotTime(h,d){
    const W=720,H=360,pad=44;
    const tmax=d.T[d.T.length-1], vmax=Math.max(...d.X,...d.Y,1)*1.08;
    const sx=t=>pad+t/tmax*(W-pad-14), sy=v=>H-pad-v/vmax*(H-pad-14);
    const line=(arr,col)=>h("path",{d:arr.map((v,i)=>(i?"L":"M")+sx(d.T[i])+" "+sy(v)).join(" "),fill:"none",stroke:col,strokeWidth:2});
    const yt=[0,0.25,0.5,0.75,1].map(f=>+(vmax*f).toFixed(1));
    const xt=[0,0.25,0.5,0.75,1].map(f=>Math.round(tmax*f));
    return h("div",null,
      this.plotFrame(h,W,H,"velocity",
        [
          yt.map((v,i)=>h("g",{key:"y"+i},h("line",{x1:pad,y1:sy(v),x2:W-14,y2:sy(v),stroke:"var(--color-divider)",strokeWidth:1}),
            h("text",{x:pad-8,y:sy(v)+4,textAnchor:"end",fontSize:11,fill:"var(--color-neutral-600)"},v))),
          xt.map((t,i)=>h("text",{key:"x"+i,x:sx(t),y:H-pad+18,textAnchor:"middle",fontSize:11,fill:"var(--color-neutral-600)"},t)),
          line(d.X,"var(--color-accent)"), line(d.Y,"var(--color-accent-2-800)"),
        ],"time  t","population"),
      h("div",{style:{display:"flex",gap:"20px",marginTop:"14px",fontSize:"13px"}},
        h("span",{style:{display:"flex",alignItems:"center",gap:"7px"}},h("span",{style:{width:"18px",height:"2.5px",background:"var(--color-accent)"}}),h("span",{className:"psy-mono"},"x — prey")),
        h("span",{style:{display:"flex",alignItems:"center",gap:"7px"}},h("span",{style:{width:"18px",height:"2.5px",background:"var(--color-accent-2-800)"}}),h("span",{className:"psy-mono"},"y — predator")),
      ),
    );
  }
  plotPhase(h,d){
    const W=520,H=440,pad=44;
    const xmax=Math.max(...d.X,1)*1.08, ymax=Math.max(...d.Y,1)*1.08;
    const sx=v=>pad+v/xmax*(W-pad-14), sy=v=>H-pad-v/ymax*(H-pad-14);
    const path=d.X.map((v,i)=>(i?"L":"M")+sx(v)+" "+sy(d.Y[i])).join(" ");
    return h("div",null,
      this.plotFrame(h,W,H,"",
        [
          [0.25,0.5,0.75,1].map((f,i)=>h("line",{key:"gx"+i,x1:sx(xmax*f),y1:pad-8,x2:sx(xmax*f),y2:H-pad,stroke:"var(--color-divider)"})),
          [0.25,0.5,0.75,1].map((f,i)=>h("line",{key:"gy"+i,x1:pad,y1:sy(ymax*f),x2:W-14,y2:sy(ymax*f),stroke:"var(--color-divider)"})),
          h("path",{d:path,fill:"none",stroke:"var(--color-accent)",strokeWidth:2}),
          h("circle",{cx:sx(d.X[0]),cy:sy(d.Y[0]),r:4,fill:"var(--color-bg)",stroke:"var(--color-accent-800)",strokeWidth:2}),
          h("circle",{cx:sx(d.X[d.X.length-1]),cy:sy(d.Y[d.Y.length-1]),r:5,fill:"var(--color-accent)"}),
        ],"prey  x","predator  y"),
      h("div",{className:"text-muted",style:{fontSize:"12px",marginTop:"12px"}},"○ initial state · ● final state — the trajectory spirals toward the steady state (x=2, y=1.6)."),
    );
  }
  plotFrame(h,W,H,_,inner,xlab,ylab){
    const pad=44;
    return h("svg",{viewBox:`0 0 ${W} ${H}`,style:{width:"100%",maxWidth:W+"px",display:"block"}},
      h("rect",{x:pad,y:pad-8,width:W-pad-14,height:H-pad-(pad-8),fill:"none",stroke:"var(--color-divider)"}),
      inner,
      h("line",{x1:pad,y1:pad-8,x2:pad,y2:H-pad,stroke:"var(--color-text)",strokeWidth:1}),

      xlab&&h("text",{x:(W+pad)/2,y:H-6,textAnchor:"middle",fontSize:12,fill:"var(--color-text)",fontFamily:"var(--font-heading)"},xlab),
      ylab&&h("text",{x:14,y:(H)/2,textAnchor:"middle",fontSize:12,fill:"var(--color-text)",fontFamily:"var(--font-heading)",transform:`rotate(-90 14 ${H/2})`},ylab),
    );
  }
  dataTable(h,d){

      el.dataset.done=k;
    });
    const rc=document.querySelector('.psy-rail-toggle [data-rail-chevron]');
    if(rc && !rc.dataset.done){
      rc.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17l-5-5 5-5"/><path d="M18 17l-5-5 5-5"/></svg>';
      rc.dataset.done="1";
    }
  }
}
</script>
